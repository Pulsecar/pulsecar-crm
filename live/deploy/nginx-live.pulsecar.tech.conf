# nginx: live.pulsecar.tech → модуль Pulsecar Live (127.0.0.1:3010)
# Сертификат: certbot --nginx -d live.pulsecar.tech
map $http_upgrade $live_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name live.pulsecar.tech;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name live.pulsecar.tech;

    ssl_certificate     /etc/letsencrypt/live/live.pulsecar.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.pulsecar.tech/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # видео идёт по WebSocket — долгие соединения без буферизации
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $live_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
