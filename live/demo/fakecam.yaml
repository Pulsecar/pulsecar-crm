# Имитация камеры Tapo: rtsp://demo:demo12345@127.0.0.1:18554/stream1 (видео + звук).
api:
  listen: "127.0.0.1:11985"
rtsp:
  listen: "127.0.0.1:18554"
  username: demo
  password: demo12345
webrtc:
  listen: ""
streams:
  stream1: exec:ffmpeg -hide_banner -v error -re -f lavfi -i testsrc2=size=1280x720:rate=15 -f lavfi -i sine=frequency=800:sample_rate=16000 -c:v libx264 -preset ultrafast -tune zerolatency -g 30 -pix_fmt yuv420p -c:a aac -rtsp_transport tcp -f rtsp {output}
  stream2: exec:ffmpeg -hide_banner -v error -re -f lavfi -i testsrc2=size=640x360:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -g 30 -pix_fmt yuv420p -rtsp_transport tcp -f rtsp {output}
