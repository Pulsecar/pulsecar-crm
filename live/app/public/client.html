<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulsecar — naprawa na żywo</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="client">
  <div class="phone">
    <div class="cbar">
      <div class="logo">Pulsecar<small>WARSZTAT · BIELANY, WARSZAWA</small></div>
      <span class="plate-badge" id="plate" hidden><span id="plate-t"></span></span>
    </div>
    <div class="player" id="player">
      <div class="overlay" id="ov"><div><h3 id="ov-h">Łączenie…</h3><p id="ov-p"></p></div></div>
    </div>
    <div class="cinfo" id="info" hidden>
      <div><span class="eyebrow">Samochód</span><b id="i-car"></b></div>
      <div><span class="eyebrow">Stanowisko</span><b id="i-cam"></b></div>
      <div><span class="eyebrow">Dostęp</span><b id="i-when"></b></div>
    </div>
    <div class="foot" id="foot" hidden></div>
  </div>
</div>
<script type="module" src="/static/player.js"></script>
<script src="/static/client.js"></script>
</body></html>
