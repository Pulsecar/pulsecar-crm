# Вариант для nginx (если он уже стоит на VPS). Сертификаты — certbot.
server {
    server_name panel.pulsecar.tech;
    listen 443 ssl;
    client_max_body_size 30m;
    location / { proxy_pass http://127.0.0.1:3100; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
}
server {
    server_name marketing.pulsecar.tech;
    listen 443 ssl;
    location = /__auth { internal; proxy_pass http://127.0.0.1:3100/crm-api/auth-check; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Cookie $http_cookie; }
    location / {
        auth_request /__auth;
        error_page 401 = @login;
        proxy_pass http://127.0.0.1:8080;          # порт панели бота
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors https://panel.pulsecar.tech";
    }
    location @login { return 302 https://panel.pulsecar.tech/#/marketing; }
}
