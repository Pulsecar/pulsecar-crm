<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ИИ-запчастист — настройки</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1b1f27;background:#fff;min-width:340px}
  main{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:520px}
  h1{font-size:16px;margin:0}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
  input{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid #cdd2da;border-radius:8px;padding:9px 11px;min-height:42px}
  button{min-height:42px;padding:8px 14px;border-radius:8px;border:1px solid #1f55c4;background:#1f55c4;color:#fff;font:inherit;cursor:pointer}
  .muted{font-size:12.5px;color:#5b6372}
  #st{font-size:13px}
</style>
</head>
<body>
<main>
  <h1>ИИ-запчастист · partslink24</h1>
  <div class="muted">Расширение работает в вашей сессии partslink24: войдите в partslink24 в этом Chrome как обычно. Логин и пароль расширение не хранит и не читает.</div>
  <div><label for="url">Адрес сервиса</label><input id="url" placeholder="https://ai-parts.pulsecar.pl"></div>
  <div><label for="key">Ключ расширения</label><input id="key" placeholder="pl24_…"></div>
  <button id="save">Сохранить и проверить</button>
  <div id="st"></div>
</main>
<script src="options.js"></script>
</body>
</html>
